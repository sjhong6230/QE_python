name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MPICC: mpicc
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"

jobs:
  serial:
    name: Serial / Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.12"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            openmpi-bin \
            libopenmpi-dev \
            libfftw3-dev \
            libfftw3-mpi-dev \
            libopenblas-dev \
            liblapacke-dev

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --editable .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run serial test suite
        run: python -m pytest -q

  mpi:
    name: MPI / Python 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            openmpi-bin \
            libopenmpi-dev \
            libfftw3-dev \
            libfftw3-mpi-dev \
            libopenblas-dev \
            liblapacke-dev

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install --editable .

      - name: Verify FFTW-MPI build
        run: |
          python -c "from qepy_pw import _native_fft; assert _native_fft.fftw_mpi_available()"

      - name: Run MPI tests
        run: |
          mpiexec --oversubscribe -n 4 \
            python -m pytest -q tests/test_fft_parallel.py

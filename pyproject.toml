[build-system]
requires = [
    "setuptools>=77.0.3",
    "Cython>=3.1",
    "numpy>=1.24",
    "mpi4py>=4.0",
    "pyfftw>=0.15",
]
build-backend = "setuptools.build_meta"

[project]
name = "qepy-pw"
version = "1.0.2"
description = "A small, readable Python port of the scalar SCF path in Quantum ESPRESSO pw.x"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-2.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "Seung-Ju Hong", email = "sjhong6230@snu.ac.kr"},
]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 or later (GPLv2+)",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "threadpoolctl>=3.1",
    "h5py>=3.8",
    "mpi4py>=4.0",
    "pyfftw>=0.15",
    "spglib>=2.5",
    "pyxtal>=1.0",
    "ase>=3.22",
]

[project.urls]
Homepage = "https://github.com/sjhong6230/QE_python"
Repository = "https://github.com/sjhong6230/QE_python"
Issues = "https://github.com/sjhong6230/QE_python/issues"

[project.scripts]
"pw.py" = "qepy_pw.pw.launcher:main"
"bands.py" = "qepy_pw.pp.bands:main"
"plotband.py" = "qepy_pw.pp.plotband:main"
"dos.py" = "qepy_pw.pp.dos:main"
"projwfc.py" = "qepy_pw.pp.projwfc:main"
"pp.py" = "qepy_pw.pp.pp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["qepy_pw*"]

[tool.setuptools.package-data]
qepy_pw = ["*.pyx"]

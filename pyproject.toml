[build-system]
requires = [
    "setuptools>=68",
    "Cython>=3.1",
    "numpy>=1.24",
    "mpi4py>=4.0",
    "pyfftw>=0.15",
]
build-backend = "setuptools.build_meta"

[project]
name = "qepy-pw"
version = "1.0.1"
description = "A small, readable Python port of the scalar SCF path in Quantum ESPRESSO pw.x"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "threadpoolctl>=3.1",
    "h5py>=3.8",
    "mpi4py>=4.0",
    "pyfftw>=0.15",
    "spglib>=2.5",
    "pyxtal>=1.0",
    "ase>=3.22",
]

[project.scripts]
"pw.py" = "qepy_pw.pw.launcher:main"
"bands.py" = "qepy_pw.pp.bands:main"
"plotband.py" = "qepy_pw.pp.plotband:main"
"dos.py" = "qepy_pw.pp.dos:main"
"projwfc.py" = "qepy_pw.pp.projwfc:main"
"pp.py" = "qepy_pw.pp.pp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["qepy_pw*"]

[tool.setuptools.package-data]
qepy_pw = ["*.pyx"]

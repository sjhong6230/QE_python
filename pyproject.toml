[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qepy-pw"
version = "0.6.14"
description = "A small, readable Python port of the scalar SCF path in Quantum ESPRESSO pw.x"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "threadpoolctl>=3.1", "h5py>=3.8"]

[project.optional-dependencies]
fft = ["pyfftw>=0.15"]
jit = ["numba>=0.60"]
performance = ["numba>=0.60", "pyfftw>=0.15"]
mpi = ["mpi4py>=3.1"]

[project.scripts]
"pw.py" = "qepy_pw.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["qepy_pw*"]
